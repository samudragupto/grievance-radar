services:
  grievance-radar:
    build: .
    container_name: grievance-radar
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=prod-radar-secret-key-replace-in-env
      - CLUSTERING_ALGO=bertopic
      - EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - ZSCORE_THRESHOLD=2.5
      - PERCENT_CHANGE_THRESHOLD=50.0
      - ROLLING_WEEKS=4
      - MAX_FINDINGS=3
    volumes:
      - ./instance:/app/instance
