services:
  grievance-radar:
    build: .
    container_name: grievance-radar
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      # Refuse to start with the previously hard-coded default secret.
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in your environment (see .env.example) before starting the stack}
      - CLUSTERING_ALGO=${CLUSTERING_ALGO:-bertopic}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      - ZSCORE_THRESHOLD=${ZSCORE_THRESHOLD:-2.5}
      - PERCENT_CHANGE_THRESHOLD=${PERCENT_CHANGE_THRESHOLD:-50.0}
      - ROLLING_WEEKS=${ROLLING_WEEKS:-4}
      - MAX_FINDINGS=${MAX_FINDINGS:-3}
    volumes:
      - ./instance:/app/instance
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
