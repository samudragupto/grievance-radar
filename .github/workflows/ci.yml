name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 isort

      - name: Check Code Formatting (Black)
        run: black --check .

      - name: Check Import Order (isort)
        run: isort --check .

      - name: Lint with Flake8
        run: flake8 app/ tests/ scripts/

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Cache Sentence Transformers Model
        uses: actions/cache@v4
        id: cache-st-model
        with:
          path: ~/.cache/huggingface/hub
          key: ${{ runner.os }}-st-model-all-MiniLM-L6-v2

      - name: Pre-download Embedding Model
        if: steps.cache-st-model.outputs.cache-hit != 'true'
        run: |
          python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')"

      - name: Run Pytest Suite with Coverage
        run: |
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
